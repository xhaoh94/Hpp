/* VSCode-style overlay scrollbar utility: Only the thumb (fingers) is drawn —
   there is no persistent track/“base” underneath.
   - .overlay-scroll: hidden by default, only shown while the mouse is over
     the scrolling element.
   - .persistent-scroll: the thumb is always visible.
   Both keep layout stable via scrollbar-gutter. Add the class to any
   scrollable container to get this look. */
.overlay-scroll,
.persistent-scroll {
  scrollbar-width: thin;
  scrollbar-gutter: stable;
}

.overlay-scroll {
  scrollbar-color: transparent transparent;
}

.persistent-scroll {
  scrollbar-color: var(--scrollbar-thumb) transparent;
}

.overlay-scroll:hover,
.persistent-scroll:hover {
  scrollbar-color: var(--scrollbar-thumb-hover) transparent;
}

.overlay-scroll::-webkit-scrollbar,
.persistent-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.overlay-scroll::-webkit-scrollbar-track,
.persistent-scroll::-webkit-scrollbar-track {
  background: transparent;
}

/* Thumb shape is shared. Color differs: overlay hides it until hover;
   persistent keeps it visible at all times. */
.overlay-scroll::-webkit-scrollbar-thumb,
.persistent-scroll::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 6px;
  min-height: 32px;
}

.persistent-scroll::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
}

.overlay-scroll:hover::-webkit-scrollbar-thumb,
.persistent-scroll:hover::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
}

.persistent-scroll::-webkit-scrollbar-thumb:hover,
.overlay-scroll:hover::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
}

  overflow: hidden;
  border: 1px solid var(--border-color);
  border-radius: 7px;

.settings-theme-preview-panel {
  position: absolute;

.settings-modal-overlay {

.agent-remove-confirm-content > p {

  color: var(--text-secondary);

.agent-remove-runtime-toggle {

.agent-remove-confirm-actions {

  justify-content: flex-end;
  gap: 8px;

.settings-modal-header {

  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;

.settings-modal-title-actions {

.settings-modal-header-icon {

}

.settings-modal-close {

  justify-content: center;

  padding: 4px 8px;

.settings-modal-close:hover {

.settings-modal-content {

.settings-general-title,

.settings-general-title-icon,

}

.settings-general-title-icon {

.settings-general-heading-button:hover .settings-general-collapse-icon {

@keyframes settings-general-section-open {
  from { opacity: 0; transform: translateY(-3px); }
  to { opacity: 1; transform: translateY(0); }

.settings-general-heading-icon {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  background: var(--bg-tertiary);
}

.settings-general-heading h4 {

  font-size: 13px;
  font-weight: 600;

.settings-general-heading p {

.settings-general-content .settings-theme-option {

.settings-general-content .settings-theme-option-label {

.settings-general-row {

  display: flex;

  flex-direction: column;

  font-weight: 600;

  white-space: nowrap;
}

.settings-general-row-main > span {
  overflow: hidden;
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.45;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.settings-general-toggle {
  cursor: pointer;
}

.settings-general-toggle input {
  position: relative;
  width: 32px;
  height: 18px;
  flex: 0 0 32px;
  margin: 0;
  appearance: none;
  border: 1px solid var(--border-color);
  border-radius: 999px;
  background: var(--bg-tertiary);
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease;
}

.settings-general-toggle input::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 140ms ease, background-color 140ms ease;
}

.settings-general-toggle input:checked {
  border-color: var(--accent-color);

}

  transform: translateX(14px);
  background: #fff;
}

.settings-general-toggle input:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent-color) 32%, transparent);
  outline-offset: 2px;
}

  border-bottom: 1px solid var(--border-color);
}

  grid-template-columns: 30px minmax(0, 1fr) auto 16px;
  gap: 10px;
  padding: 9px 12px;
  border: 0;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-primary);
  color: var(--text-secondary);
  font: inherit;
  cursor: pointer;
  text-align: left;
}

.settings-general-link:last-child {

}

.settings-general-link:hover {

  color: var(--text-primary);
}

  height: 30px;

  color: var(--accent-color);
}

.settings-general-link-meta {

  font-size: 11px;

}

  border-radius: 4px;
  background: var(--bg-tertiary);

.settings-compaction-body {

.settings-compaction-select,

  display: grid;
  min-height: 50px;
  grid-template-columns: minmax(0, 1fr) 120px;
  grid-template-rows: auto 4px;
  align-items: center;
  gap: 5px 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
}

.settings-storage-row-label {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--text-primary);
  font-size: 11px;
}

.settings-storage-row-label strong {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 600;
}

.settings-storage-row small {
  grid-column: 2;
  grid-row: 1 / span 2;
  text-align: right;
  white-space: nowrap;
}

.settings-storage-meter {
  height: 4px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--bg-tertiary);
}

.settings-storage-meter > span {
  display: block;
  height: 100%;
  max-width: 100%;
  border-radius: inherit;
  background: var(--accent-color);
}

.settings-storage-path {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
}

.settings-storage-path code {
  overflow: hidden;
  color: var(--text-secondary);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.settings-storage-state {
  padding: 16px 12px;
  color: var(--text-secondary);
  font-size: 11px;
}

.settings-storage-state.error {
  color: #ef4444;
}

.settings-storage-refreshing {
  animation: settings-storage-spin 700ms linear infinite;
}

@keyframes settings-storage-spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 560px) {
  .settings-general-modal {
    width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
  }

  .settings-general-section {
    padding-right: 14px;
    padding-left: 14px;
  }

  .settings-general-content .settings-theme-options {
    padding-left: 0;
  }

  .settings-general-link {
    grid-template-columns: 30px minmax(0, 1fr) 16px;
  }

  .settings-general-row.settings-general-path-row {
    align-items: stretch;
    flex-direction: column;
  }

  .settings-general-path-control {
    width: 100%;
    flex-basis: auto;
  }

  .settings-compaction-row,
  .settings-subagent-row {
    align-items: stretch;
    flex-direction: column;
  }

  .settings-compaction-select,
  .settings-subagent-model-picker {
    width: 100%;
    flex-basis: auto;
  }

  .settings-compaction-custom-model {
    grid-template-columns: 1fr;
  }

  .settings-compaction-reasoning {
    grid-column: auto;
  }

  .settings-compaction-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .settings-compaction-actions .filter-add-btn {
    width: 100%;
  }

  .settings-general-link-meta {
    display: none;
  }

  .settings-storage-row {
    grid-template-columns: minmax(0, 1fr) 110px;
  }
}

@media (max-width: 380px) {
  .settings-general-content .settings-theme-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
}

.modal-section:last-child {

.settings-quick-buttons {

.send-mode-select {

}

.agent-config-modal {

}

.agent-config-header {

  align-items: flex-start;
  gap: 16px;
  padding-bottom: 12px;
}

.agent-config-header > .settings-modal-close {
  position: absolute;
  top: 16px;

}

.agent-config-header-main {
  flex: 1;
  min-width: 0;
}

.agent-config-subtitle {
  margin-top: 3px;

  white-space: nowrap;
}

.agent-config-title-row {
  display: flex;
  align-items: center;

}

.agent-config-tabs {
  display: flex;

  gap: 4px;
  margin-top: 12px;

}

.agent-config-tabs::-webkit-scrollbar {
  display: none;
}

.agent-config-tab {
  height: 28px;

  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;

}

.agent-config-tab:hover {

}

.agent-config-tab.active {

}

.agent-config-content {

.agent-config-toolbar {

  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 10px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);

}

.agent-config-toolbar > span {
  flex: 1 1 280px;

}

.agent-config-toolbar-actions {
  display: flex;

  justify-content: flex-end;
  flex-flow: row wrap;
  gap: 10px;
  flex: 0 1 auto;
  min-width: 0;
}

/* 只让实际渲染的控件参与布局；任意 capability 按钮隐藏后不保留占位。 */
.agent-config-toolbar-actions > .btn-action,
.agent-config-toolbar-actions > .agent-config-model-visibility {
  flex: 0 0 auto;
}

.agent-config-model-visibility {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
  white-space: nowrap;
  cursor: pointer;
}

.agent-config-model-visibility input {
  position: relative;
  width: 30px;
  height: 16px;
  margin: 0;
  appearance: none;
  border: 1px solid var(--border-color);
  border-radius: 999px;
  background: var(--bg-primary);
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}

.agent-config-model-visibility input::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 0.15s, background-color 0.15s;
}

.agent-config-model-visibility input:checked {
  border-color: var(--accent-color);
  background: color-mix(in srgb, var(--accent-color) 32%, var(--bg-primary));
}

.agent-config-model-visibility input:checked::after {
  transform: translateX(14px);
  background: var(--text-primary);
}

.agent-config-model-visibility input:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.agent-config-grid {
  display: grid;
  grid-template-columns: minmax(260px, 0.38fr) minmax(0, 1fr);

  min-height: 360px;

}

.agent-config-provider-list,
.agent-config-form {

  background: var(--bg-tertiary);
}

.agent-config-provider-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  min-height: 0;
  overflow: hidden;
}

.agent-config-form {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 12px;
  overflow: hidden;
}

.agent-config-provider-scroll {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 8px;
  margin-block: -5px;
  overflow-y: auto;
  padding-block: 5px;
  padding-right: 4px;
}

.agent-provider-editor-overlay {
  z-index: 1002;
  background: rgba(0, 0, 0, 0.58);
}

.agent-provider-editor-modal {
  width: min(980px, calc(100vw - 48px));
  height: min(82vh, 760px);
  max-height: min(82vh, 760px);
}

.agent-provider-editor-content {
  display: flex;
  min-height: 0;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
}

.agent-config-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}

.agent-config-provider-item {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
  transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
}

.agent-config-provider-item:hover {
  border-color: color-mix(in srgb, var(--border-color) 65%, var(--text-secondary));
  background: color-mix(in srgb, var(--bg-primary) 90%, var(--text-primary));
}

.agent-config-provider-item.dragging {
  opacity: 0.55;
  border-style: dashed;
  cursor: grabbing;
}

.agent-config-provider-item.drop-target {
  border-color: var(--border-color);
  box-shadow: none;
}

.agent-config-provider-item.drop-target::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 999px;
  background: var(--accent-color);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-color) 25%, transparent), 0 0 7px color-mix(in srgb, var(--accent-color) 45%, transparent);
  pointer-events: none;
  z-index: 2;
}

.agent-config-provider-item.drop-target.after::before {
  top: auto;
  bottom: -5px;
}

.agent-config-provider-item.reordering {
  opacity: 0.72;
}

.agent-config-provider-item.selected {
  border-color: rgba(255, 255, 255, 0.22);
  background: color-mix(in srgb, var(--bg-primary) 82%, var(--text-primary));
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
}

.agent-config-provider-item.active {
  position: relative;
  background: rgba(0, 120, 212, 0.10);
  border-color: var(--accent-color);
  box-shadow: 0 0 0 1px rgba(0, 120, 212, 0.22);
}

.agent-config-provider-item.active::before {
  content: "";
  position: absolute;
  left: -1px;
  top: 9px;
  bottom: 9px;
  width: 3px;
  border-radius: 999px;
  background: var(--accent-color);
}

.agent-config-provider-item.selected.active {
  border-color: var(--accent-color);
  background:
    linear-gradient(0deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.04)),
    rgba(0, 120, 212, 0.10);
}

.agent-config-provider-drag {
  width: 14px;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-secondary);
  cursor: grab;
  opacity: 0.72;
}

.agent-config-provider-item:hover .agent-config-provider-drag,
.agent-config-provider-item.selected .agent-config-provider-drag {
  opacity: 1;
}

.agent-config-provider-item.dragging .agent-config-provider-drag {
  cursor: grabbing;
}

.agent-config-provider-avatar {
  width: 28px;

  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: rgba(0, 120, 212, 0.16);

}

.agent-config-provider-main {

}

.agent-config-provider-title-line {

}

.agent-config-provider-name {
  color: var(--text-primary);

}

.agent-config-provider-check {

}

.agent-config-provider-url {
  color: var(--text-secondary);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;

}

.agent-config-provider-id {
  color: var(--text-secondary);
  font-size: 11px;
  white-space: nowrap;

}

.agent-config-provider-actions {

.agent-config-active-badge {

}

.agent-config-mini-btn {

.agent-config-add-provider,

}

.agent-config-add-provider {
  margin-top: auto;
  width: 100%;
}

.agent-config-form-header,
.agent-config-models-header {
  /* 列标题与右侧按钮同排：复用列表的列宽，保证标题与下方输入框对齐。 */

  grid-template-columns: var(--agent-model-columns);
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
  padding: 0 9px;
}

.agent-config-model-head-label {

  color: var(--text-tertiary, var(--text-secondary));

  line-height: 1.4;

  text-align: left;

.agent-config-models-header .agent-config-model-actions {
  grid-column: 4 / 6;

  height: 24px;
  padding: 0 9px;
  border-color: color-mix(in srgb, var(--border-color) 70%, transparent);

}

.agent-config-models-header .agent-config-mini-btn:hover:not(:disabled) {
  border-color: var(--accent-color);
  background: var(--bg-hover);
  color: var(--text-primary);
}

.agent-config-form-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* 主动保存：有未保存改动时在保存按钮旁提示。 */
.agent-config-dirty-hint {
  color: var(--warning, #d9a441);
  font-size: 11px;
  white-space: nowrap;
}

.agent-config-model-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.agent-config-spin {
  animation: agent-config-spin 0.8s linear infinite;
}

@keyframes agent-config-spin {
  to { transform: rotate(360deg); }
}

.agent-config-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.agent-config-fields label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--text-secondary);
  font-size: 11px;
}

.agent-config-fields .agent-config-field-wide {
  grid-column: 1 / -1;
}

/* 模型面板 = 一张内嵌卡片：表头固定在顶部，只有列表在内部滚动。 */
.agent-config-models-panel {
  display: flex;
  min-height: 260px;
  flex: 1 1 auto;
  flex-direction: column;
  /* 四周留白交给表头与列表各自负责，避免卡片里再套一张卡片的双层边框。 */
  padding: 0;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  background: var(--bg-primary);
  overflow: hidden;
}

.agent-config-models-panel .agent-config-models-header {
  flex: 0 0 auto;
  /* 左右内边距 = 列表内边距(8) + 行内边距(6)，列标题才能和下方输入框左对齐。 */
  padding: 6px 14px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border-color);
  background: var(--surface-subtle);
}

.agent-config-models-panel .agent-config-model-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  /* 隐藏滚动条（仍可滚动），避免右侧多出一条竖线。 */
  scrollbar-width: none;
  padding: 4px 8px 8px;
}

.agent-config-models-panel .agent-config-model-list::-webkit-scrollbar {
  width: 0;
  height: 0;
}

.agent-config-fetch-error {

.agent-model-picker-overlay {

.agent-provider-delete-overlay {

.agent-provider-copy-content {

  gap: 12px;

.agent-provider-copy-source strong {

.agent-provider-copy-avatar {
  display: flex;
  width: 30px;
  height: 30px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 10px;
  font-weight: 600;
}

.agent-provider-copy-main {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 2px;
}

.agent-provider-copy-title {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 6px;
}

.agent-provider-copy-main .agent-provider-copy-current {
  flex: none;
  padding: 1px 5px;
  border: 1px solid var(--border-color);
  border-radius: 4px;
  color: var(--text-secondary);
  font-size: 9px;
  line-height: 14px;
}

.agent-provider-copy-main strong,
.agent-provider-copy-main span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-provider-copy-main strong {
  color: var(--text-primary);
  font-size: 12px;
}

.agent-provider-copy-main span {
  color: var(--text-secondary);
  font-size: 10px;
}

.agent-provider-copy-btn {
  min-width: 88px;
  justify-content: center;
}

.agent-provider-copy-error {
  margin: 0;
  padding: 8px 10px;
  font-size: 11px;
}

.agent-provider-delete-target {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 10px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
}

.agent-provider-delete-target span {
  color: var(--text-secondary);
  font-size: 11px;
}

.agent-provider-delete-target code {
  min-width: 0;
  overflow: hidden;
  color: var(--text-primary);
  font-family: monospace;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-provider-delete-error {
  margin: 12px 0 0;
  padding: 8px 10px;
  font-size: 11px;
}

.agent-remove-confirm-actions .filter-add-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.agent-model-picker-modal {
  width: min(660px, calc(100vw - 48px));
  max-height: min(76vh, 640px);
}

.agent-model-picker-content {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 10px;
}

.agent-model-picker-search {
  position: relative;
  display: flex;
  align-items: center;
}

.agent-model-picker-search > svg {
  position: absolute;
  left: 10px;
  color: var(--text-secondary);
  pointer-events: none;
}

.agent-model-picker-search .input-field {
  padding-left: 32px;
}

.agent-model-picker-toolbar,
.agent-model-picker-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.agent-model-picker-toolbar > span {
  color: var(--text-secondary);
  font-size: 11px;
}

.agent-model-picker-list {
  flex: 1;
  min-height: 220px;
  overflow-y: auto;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
}

.agent-model-picker-row {
  display: grid;
  grid-template-columns: 18px minmax(120px, 0.8fr) minmax(160px, 1.2fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
  cursor: pointer;
}

.agent-model-picker-row:last-child {
  border-bottom: 0;
}

.agent-model-picker-row:hover {
  background: var(--bg-hover);
}

.agent-model-picker-row.configured {
  cursor: default;
  opacity: 0.62;
}

.agent-model-picker-row input {
  accent-color: var(--accent-color);
}

.agent-model-picker-name,
.agent-model-picker-row code {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.agent-model-picker-row code {
  color: var(--text-secondary);
  font-family: monospace;
}

.agent-model-picker-badge {
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(16, 185, 129, 0.12);
  color: #10b981;
  font-size: 10px;
  white-space: nowrap;
}

.agent-model-picker-footer {
  justify-content: flex-end;
  padding: 12px 20px;
  border-top: 1px solid var(--border-color);
}

/* 模型列表：行只在 hover 时高亮，分隔线交给行本身的 border。 */
/* 列宽变量放在面板上：列标题行与列表共用。 */
.agent-config-models-panel {
  /* 能力列给一个刚好够用的上限，剩余宽度交给 ID/显示名，避免中间大片空白。 */
  --agent-model-columns: 22px minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 250px) 28px;
}

.agent-config-model-list {
  display: flex;
  flex-direction: column;
}

.agent-config-model-row {
  position: relative;
  display: grid;
  grid-template-columns: var(--agent-model-columns);
  align-items: center;
  gap: 9px;
  padding: 6px;
  border-bottom: 1px solid color-mix(in srgb, var(--border-color) 50%, transparent);
  border-radius: 6px;
  background: transparent;
  transition: background-color 0.12s ease;
}

.agent-config-model-row:last-child {
  border-bottom: 0;
}

.agent-config-model-row:hover {
  background: color-mix(in srgb, var(--bg-hover) 75%, transparent);
}

/* 行内输入框：清掉 .input-field 的下外边距，整行才能按 28px 垂直居中。
   多一层 .agent-config-models-panel 是为了压过下方 .agent-config-modal .input-field 的内边距。 */
.agent-config-models-panel .agent-config-model-row .input-field {
  height: 28px;
  padding: 0 9px;
  margin-bottom: 0;
  border-radius: 5px;
  font-size: 12px;
}

/* 能力区里的档位下拉跟着行高收到 28px，内置行与自定义行高度一致。 */
.agent-config-model-row .agent-thinking-multiselect-trigger {
  height: 28px;
}

/* 内置模型没有能力控件：显示名跨过空的能力列，保留 ID 宽度并吃掉右侧空白。 */
.agent-config-model-row.builtin > .agent-config-model-display-name {
  grid-column: 3 / 5;
}

/* 删除按钮显式落在最后一列：内置行少了能力控件，靠自动排布会被挤到第二行左侧。 */
.agent-config-model-row > .btn-delete {
  grid-column: 5;
  justify-self: end;
  opacity: 0.45;
  transition: opacity 0.12s ease, color 0.12s ease, background-color 0.12s ease;
}

.agent-config-model-row:hover > .btn-delete:not(:disabled),
.agent-config-model-row > .btn-delete:focus-visible {
  opacity: 1;
}

.agent-config-model-row > .btn-delete:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}

.agent-config-model-drag {
  display: grid;
  height: 28px;
  place-items: center;
  border-radius: 5px;
  color: var(--text-tertiary, var(--text-secondary));
  opacity: 0.5;
  cursor: grab;
  transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease;
}

.agent-config-model-row:hover > .agent-config-model-drag {
  opacity: 1;
}

.agent-config-model-drag:hover {
  background: color-mix(in srgb, var(--bg-hover) 80%, transparent);
  color: var(--text-primary);
}

.agent-config-model-drag:active {
  cursor: grabbing;
}

.agent-config-model-row.dragging {
  opacity: 0.55;
}

.agent-config-model-row.drop-before {
  box-shadow: inset 0 2px 0 0 var(--accent-color);
}

.agent-config-model-row.drop-after {
  box-shadow: inset 0 -2px 0 0 var(--accent-color);
}

.agent-config-model-checks {
  display: flex;
  align-items: center;
  /* 能力区靠右对齐，紧贴删除按钮一侧。 */
  justify-content: flex-end;
  gap: 10px;
  min-width: 0;
  flex-wrap: nowrap;
}

.agent-config-model-checks .agent-config-check {
  flex: 0 0 auto;
}

.agent-config-model-checks .agent-config-thinking-levels {
  /* 不撑满剩余宽度：图片勾选与思考档位保持紧凑，整体靠右贴。 */
  flex: 0 1 auto;
  min-width: 0;
}

.agent-config-thinking-levels {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  font-size: 10px;
}

.agent-config-thinking-levels > span {
  flex: 0 0 auto;
  white-space: nowrap;
}

.agent-thinking-multiselect {
  position: relative;
  /* 档位文本很短：固定一个紧凑宽度，两个字的档位名也不会被省略。 */
  flex: 0 0 auto;
  width: 112px;
  max-width: 100%;
  min-width: 0;
}

.agent-thinking-multiselect-trigger {
  display: flex;
  width: 100%;
  min-width: 0;
  height: 32px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 10px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.agent-thinking-multiselect-trigger:hover {
  border-color: color-mix(in srgb, var(--border-color) 55%, var(--text-secondary));
  background: color-mix(in srgb, var(--bg-primary) 94%, var(--text-primary));
}

.agent-thinking-multiselect-trigger span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-thinking-multiselect-trigger svg {
  flex: 0 0 auto;
  color: var(--text-tertiary);
  transition: transform 0.15s ease;
}

.agent-thinking-multiselect.open .agent-thinking-multiselect-trigger {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-color) 14%, transparent);
}

.agent-thinking-multiselect.open .agent-thinking-multiselect-trigger svg {
  transform: rotate(180deg);
}

.agent-thinking-multiselect-menu {
  position: fixed;
  z-index: 1100;
  top: 0;
  right: auto;
  bottom: auto;
  width: min(340px, calc(100vw - 32px));
  transform: none;
  padding: 12px;
  border: 1px solid color-mix(in srgb, var(--border-color) 82%, var(--text-secondary));
  border-radius: 9px;
  background: var(--bg-secondary);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
}

.agent-thinking-multiselect-menu.below {
  transform: none;
}

.agent-thinking-multiselect-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 11px;
}

.agent-thinking-multiselect-title {
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
}

.agent-thinking-multiselect-subtitle {
  margin-top: 3px;
  color: var(--text-tertiary);
  font-size: 9px;
  line-height: 1.3;
}

.agent-thinking-multiselect-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 2px;
}

.agent-thinking-multiselect-actions button {
  padding: 3px 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text-tertiary);
  font-size: 10px;
  cursor: pointer;
}

.agent-thinking-multiselect-actions button:hover,
.agent-thinking-multiselect-actions button.active {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.agent-thinking-multiselect-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  max-height: 190px;
  overflow: auto;
}

.agent-thinking-multiselect-option {
  display: flex;
  min-width: 0;
  height: 30px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 7px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: color-mix(in srgb, var(--bg-primary) 78%, transparent);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.agent-thinking-multiselect-option:hover {
  border-color: color-mix(in srgb, var(--accent-color) 45%, var(--border-color));
  background: var(--bg-hover);
  color: var(--text-primary);
}

.agent-thinking-multiselect-option.selected {
  border-color: color-mix(in srgb, var(--accent-color) 72%, var(--border-color));
  background: color-mix(in srgb, var(--accent-color) 16%, var(--bg-primary));
  color: var(--text-primary);
}

.agent-thinking-multiselect-option span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-thinking-multiselect-option svg {
  flex: 0 0 auto;
  color: var(--accent-color);
}

.agent-thinking-multiselect-option.custom {
  grid-column: span 2;
}

.agent-thinking-multiselect-custom {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-color);
}

.agent-thinking-multiselect-custom .input-field {
  height: 30px;
  font-size: 11px;
}

.agent-config-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-secondary);
  font-size: 11px;
  white-space: nowrap;
}

.agent-config-check input {
  accent-color: var(--accent-color);
}

.agent-config-modal .input-field,
.agent-provider-editor-modal .input-field,
.agent-model-picker-modal .input-field {
  width: 100%;
  min-width: 0;
  padding: 6px 9px;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 4px;
  font-size: 12px;
}

.agent-config-modal .input-field:focus,
.agent-provider-editor-modal .input-field:focus,
.agent-model-picker-modal .input-field:focus {
  outline: none;
  border-color: var(--accent-color);
}

.agent-config-secret-input {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.agent-config-secret-input .input-field {
  flex: 1;
}

.agent-config-secret-btn {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
}

.agent-config-secret-btn:hover:not(:disabled) {
  border-color: var(--accent-color);
  color: var(--text-primary);
}

.agent-config-secret-btn.copied {
  color: #10b981;
  border-color: rgba(16, 185, 129, 0.45);
}

.agent-config-secret-btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.agent-config-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.agent-config-summary-row {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
}

.agent-config-summary-row span {
  display: block;
  margin-bottom: 4px;
  color: var(--text-secondary);
  font-size: 11px;
}

.agent-config-summary-row strong {
  display: block;
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-config-summary-models {
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}

.agent-config-summary-model-list {
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 8px;
  overflow-x: hidden;
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}

.agent-config-summary-model-list:hover {
  scrollbar-color: var(--scrollbar-thumb-hover) transparent;
}

.agent-config-summary-model-list::-webkit-scrollbar {
  width: 8px;
}

.agent-config-summary-model-list::-webkit-scrollbar-track {
  background: transparent;
}

.agent-config-summary-model-list::-webkit-scrollbar-thumb {
  min-height: 32px;
  border-radius: 6px;
  background: var(--scrollbar-thumb);
}

.agent-config-summary-model-list::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
}

.agent-config-summary-model {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 9px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
}

.agent-config-summary-model span,
.agent-config-summary-model code {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.agent-config-summary-model span {
  color: var(--text-primary);
}

.agent-config-summary-model code {
  color: var(--text-secondary);
  font-family: monospace;
}

.agent-config-activate-wide {
  width: 100%;
  margin-top: 14px;
  height: 30px;
}

.agent-config-empty {
  padding: 16px;
  color: var(--text-secondary);
  font-size: 12px;
  text-align: center;
}

.agent-config-empty.compact {
  padding: 10px;
  border: 1px dashed var(--border-color);
  border-radius: 6px;
}

@media (max-width: 1080px) {
  .agent-config-models-header {
    grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 28px;
  }

  .agent-config-models-header .agent-config-model-actions {
    grid-column: 2 / 5;
  }

  /* 窄屏：隐藏列标题，能力区换到第二行，列宽改为 ID / 名字 / 删除。 */
  .agent-config-model-head-label {
    display: none;
  }

  .agent-config-model-list {
    --agent-model-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 28px;
  }

  /* 只有 4 列：删除按钮回到第 4 列，内置行也能单独占一行。 */
  .agent-config-model-row > .btn-delete {
    grid-column: 4;
  }

  .agent-config-model-row.builtin > .agent-config-model-display-name {
    grid-column: auto;
  }

  .agent-config-model-row.custom .agent-config-model-checks {
    grid-column: 2 / 4;
  }

  .agent-config-model-row.custom > .btn-delete {
    grid-row: 1 / 3;
  }
}

@media (max-width: 760px) {
  .agent-config-grid {
    grid-template-columns: 1fr;
  }

  .agent-config-fields {
    grid-template-columns: 1fr;
  }

  .agent-config-model-list {
    --agent-model-columns: 1fr;
  }

  .agent-config-model-checks {
    grid-column: auto;
    grid-row: auto;
  }

  .agent-config-model-row > .btn-delete {
    grid-column: auto;
    grid-row: auto;
    justify-self: end;
  }

  .agent-model-picker-row {
    grid-template-columns: 18px minmax(0, 1fr) auto;
  }

  .agent-model-picker-row code {
    grid-column: 2 / -1;
  }
}

.remote-access-title span,
.remote-access-overview-main span,
.remote-section-heading span,

.remote-access-overview {

.remote-access-overview-actions,

.remote-access-overview-main { gap: 10px; }
