name: Build & Publish Windows Installer

# 大文件（99MB exe）从本机上传到 GitHub 常被代理/链路中断（408/EOF/TLS timeout）。
# 在 GitHub Actions 里构建并上传走内网，不受本地网络影响。
# 只由 release-all.cjs 在脚本里显式触发（或手动补传）。
# 不加 release:published 自动触发——否则新建 Release 时会自动+手动双跑，
# 两次构建的 exe 哈希不同、互相覆盖 latest.yml，导致自动更新校验失败。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "目标 Release 标签，例如 v0.1.11"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 不能用 --ignore-scripts：ssh2 依赖的 cpu-features 在 install 阶段
        # 生成 buildcheck.gypi 并编译；跳过会让 electron-builder 的原生重建
        # 报 "buildcheck.gypi not found"。
        run: npm install

      - name: Build application
        env:
          HPP_SKIP_PLUGIN_DRIFT_CHECK: "1"
        run: npm run build

      - name: Build Windows installer
        env:
          HPP_SKIP_PLUGIN_DRIFT_CHECK: "1"
        run: npx electron-builder --win nsis --x64 --publish never --config.directories.output=windows-release

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated Windows installer build"
          # latest.yml 必须随 exe 一起上传：它含 exe 的 sha512/size，
          # 用本机生成的旧 yml 配 CI 构建的 exe 会让自动更新校验失败。
          # 插件包由 npm run build 生成（release/vX/agent-plugins/），一并上传。
          # 放 Windows workflow 上传，避免三个 workflow 同时 clobber 同一批文件。
          gh release upload "$TAG" \
            "windows-release/hpp-Setup-${VERSION}.exe" \
            "windows-release/hpp-Setup-${VERSION}.exe.blockmap" \
            "windows-release/latest.yml" \
            release/v*/agent-plugins/*.zip \
            release/v*/agent-plugins/agent-plugins.json \
            --clobber --repo "$GITHUB_REPOSITORY"
