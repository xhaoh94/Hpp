name: Build & Publish Linux AppImage

# 自动触发：release:github 创建 Release 时自动构建 AppImage 并上传。
# 也可手动触发（workflow_dispatch），填入目标 Release 标签。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "目标 Release 标签，例如 v0.1.15（Release 不存在则自动创建）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync version from tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='$VERSION'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          echo "Synced package.json version to $VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install tolerates the optional native dependency entries that are
        # omitted from the lockfile on Windows but are resolved on Ubuntu.
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never --config.directories.output=linux-release

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Release 不存在则自动创建（发布状态，非 draft）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated Linux AppImage build"
          gh release upload "$TAG" \
            linux-release/Hpp-Linux-*-x86_64.AppImage \
            linux-release/latest-linux.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
