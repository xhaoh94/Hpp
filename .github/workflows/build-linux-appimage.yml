name: Build Linux AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有 GitHub Release 标签（留空则仅上传构建产物）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install tolerates the optional native dependency entries that are
        # omitted from the lockfile on Windows but are resolved on Ubuntu.
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never --config.directories.output=linux-release

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hpp-linux-appimage
          path: |
            linux-release/Hpp-Linux-*-x86_64.AppImage
            linux-release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

      - name: Upload AppImage to release
        if: inputs.release_tag != '' || contains(github.event.head_commit.message, '[build-appimage]')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG="v$(node -e 'process.stdout.write(require("./package.json").version)')"; fi
          gh release upload "$RELEASE_TAG" linux-release/Hpp-Linux-*-x86_64.AppImage --clobber --repo "$GITHUB_REPOSITORY"
