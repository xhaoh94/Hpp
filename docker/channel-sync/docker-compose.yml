services:
  hpp-channel-sync:
    build: .
    image: hpp-channel-sync:1
    container_name: hpp-channel-sync
    restart: unless-stopped
    ports:
      # 只映射到组网网卡更安全；比扬云分配的地址请见 README。
      - "8787:8787"
    environment:
      # 必填：与 Hpp 里填的 Token 保持一致，不要用示例值。
      HPP_SYNC_TOKEN: "${HPP_SYNC_TOKEN:?请在同目录 .env 里设置 HPP_SYNC_TOKEN}"
      # 保留的最近历史快照份数，0 表示不保留。
      HPP_SYNC_HISTORY_LIMIT: "20"
      # 单个配置包大小上限（字节），默认 8MB。
      HPP_SYNC_MAX_BYTES: "8388608"
    volumes:
      - ./data:/data
